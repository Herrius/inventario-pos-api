name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ubuntu-latest trae Docker, así que Testcontainers puede levantar un
      # PostgreSQL real para el test de integración.
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test
