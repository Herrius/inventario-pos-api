spring:
  application:
    name: inventario-pos-api

  datasource:
    # Soporta tres orígenes en orden de prioridad:
    #  1) DB_URL/DB_USERNAME/DB_PASSWORD       — formato propio (compose, local).
    #  2) PGHOST/PGPORT/PGDATABASE/PGUSER/...  — Railway/Render: las inyectan ya.
    #  3) defaults locales (jdbc localhost).
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:inventario}}
    username: ${DB_USERNAME:${PGUSER:inventario}}
    password: ${DB_PASSWORD:${PGPASSWORD:inventario}}

  jpa:
    # Flyway es el dueño del esquema. Hibernate solo VALIDA que las entidades
    # cuadren con las tablas; nunca crea ni altera (evita "schema drift").
    hibernate:
      ddl-auto: validate
    # Desactiva Open Session In View (anti-patrón): mantener la sesión de BD
    # abierta durante el render de la respuesta esconde queries y degrada.
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        # Solo exponemos lo necesario, no todos los endpoints de Actuator.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  # ${PORT} es la convención que usan Railway/Render/Fly para inyectar el puerto
  # de escucha al contenedor. Default local 8080.
  port: ${PORT:8080}
